<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f0e1; --page: #fffdf7; --ink: #2b2620; --muted: #8a7f6e;
    --mark: #ffe066; --stuck: #e07a5f; --owl: #6b5b95; --pip: #e88aa0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
         font-family: Andika, "Comic Sans MS", system-ui, sans-serif;
         display: grid; place-items: center; padding: 16px; }

  /* The book */
  #book { width: min(820px, 100%); background: var(--page); border-radius: 18px;
          padding: 40px 48px 28px; box-shadow: 0 10px 30px rgba(60,40,10,.12); }
  #words { font-size: clamp(24px, 4vw, 38px); line-height: 1.9; min-height: 6em; }
  .w { padding: 0 3px; border-radius: 6px; transition: background .15s; }
  .w.read { background: var(--mark); }
  .w.current { box-shadow: inset 0 -3px 0 #d8c9a3; }
  .w.stuck { outline: 3px dashed var(--stuck); outline-offset: 2px;
             animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { outline-color: transparent; } }
  #foot { display: flex; justify-content: space-between; align-items: center;
          margin-top: 18px; color: var(--muted); font-size: 18px; gap: 12px; }
  #caption { font-style: italic; }

  /* Question pop-up */
  #ask { position: fixed; inset: 0; background: rgba(43,38,32,.35);
         display: none; place-items: center; padding: 16px; }
  #ask.on { display: grid; }
  #card { width: min(640px, 100%); background: var(--page); border-radius: 22px;
          padding: 28px 32px; box-shadow: 0 16px 40px rgba(0,0,0,.2);
          animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  #who { font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  #who.owl { color: var(--owl); } #who.pip { color: var(--pip); }
  #question { font-size: clamp(22px, 3.5vw, 32px); line-height: 1.4; }
  #hint { margin-top: 14px; color: var(--muted); font-size: 18px; }

  #start { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); }
  #start button { font: inherit; font-size: 28px; padding: 18px 36px; border: 0;
                  border-radius: 16px; background: var(--mark); cursor: pointer; }

  /* Operator strip — small, for rehearsal */
  #op { position: fixed; left: 16px; right: 16px; bottom: 8px; color: var(--muted);
        font: 12px ui-monospace, monospace; display: flex; gap: 16px; overflow: hidden;
        white-space: nowrap; }
  #ms { color: #3a9d5d; }
</style>
</head>
<body>
<div id="book">
  <div id="words"></div>
  <div id="foot"><span id="caption"></span><span id="pageNo"></span></div>
</div>

<div id="ask">
  <div id="card">
    <div id="who"></div>
    <div id="question"></div>
    <div id="hint">Say your answer out loud!</div>
  </div>
</div>

<div id="start"><button>Start reading</button></div>

<div id="op"><span id="ms"></span><span id="line"></span><span id="partial"></span></div>

<script>
const SEND_RATE = 16000;   // Ink input
const PLAY_RATE = 24000;   // Sonic output
let ctx, ws, queue = [], playingAt = 0, sources = [];
// 바지인 이후 도착하는 청크를 버리기 위한 세대 번호.
// 서버가 새 대사를 시작할 때(line) 올라간다.
let generation = 0, mutedGeneration = -1;
// Sonic has sent the whole line; once the queue drains, playback is over.
let lineDone = true;
let mode = 'reading', words = [];

const $ = (id) => document.getElementById(id);

document.querySelector('#start button').onclick = async () => {
  $('start').remove();
  ctx = new AudioContext({ sampleRate: PLAY_RATE });
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = onServerMessage;
  await startMic();
};

// --- mic -> PCM16 @16k -> server ------------------------------------------

async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  // Separate context at the send rate so the browser does the resampling.
  const micCtx = new AudioContext({ sampleRate: SEND_RATE });
  const src = micCtx.createMediaStreamSource(stream);
  const node = micCtx.createScriptProcessor(2048, 1, 1);

  node.onaudioprocess = (e) => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    ws.send(i16.buffer);
  };

  src.connect(node);
  node.connect(micCtx.destination);
}

// --- book --------------------------------------------------------------------

function showPage(msg) {
  $('words').replaceChildren();
  words = msg.words.map((w) => {
    const span = document.createElement('span');
    span.className = 'w';
    span.textContent = w;
    $('words').append(span, ' ');
    return span;
  });
  $('pageNo').textContent = `Page ${msg.page + 1} of ${msg.total}`;
  $('caption').textContent = '';
  setProgress(0);
}

/** Words before `n` were heard right; `n` is the one to read next. */
function setProgress(n) {
  words.forEach((span, i) => {
    span.classList.toggle('read', i < n);
    span.classList.toggle('current', i === n);
    span.classList.remove('stuck');
  });
}

function setMode(m) {
  mode = m;
  $('ask').classList.toggle('on', m === 'asking');
}

// --- server -> speaker -----------------------------------------------------

function onServerMessage(e) {
  const msg = JSON.parse(e.data);

  if (msg.type === 'line') {
    // 새 대사 = 새 세대. 이전 세대의 잔여 청크는 이제 무시된다.
    generation++;
    lineDone = false;
    $('line').textContent = `${msg.speaker}: ${msg.line}`;
    $('partial').textContent = '';
    if (mode === 'asking') {
      $('who').textContent = msg.speaker === 'pip' ? 'Pip asks' : 'Owl asks';
      $('who').className = msg.speaker;
      $('question').textContent = msg.line;
    } else {
      $('caption').textContent = msg.line;
    }
  }
  if (msg.type === 'page') showPage(msg);
  if (msg.type === 'progress') setProgress(msg.word);
  if (msg.type === 'stuck') words[msg.word]?.classList.add('stuck');
  if (msg.type === 'mode') setMode(msg.mode);
  if (msg.type === 'end') { setMode('done'); $('pageNo').textContent = 'The End'; }
  if (msg.type === 'partial') $('partial').textContent = msg.text;
  if (msg.type === 'latency') $('ms').textContent = `${msg.ms} ms`;
  if (msg.type === 'audio') playChunk(msg.data);
  if (msg.type === 'stop_audio') stopAudio();   // barge-in
  if (msg.type === 'audio_done') { playingAt = 0; lineDone = true; reportIfPlayed(); }
}

/** Schedule each chunk back to back so playback is gapless. */
function playChunk(b64) {
  // 바지인으로 음소거된 세대의 청크는 버린다.
  if (generation === mutedGeneration) return;

  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const i16 = new Int16Array(bytes.buffer);
  const buf = ctx.createBuffer(1, i16.length, PLAY_RATE);
  const out = buf.getChannelData(0);
  for (let i = 0; i < i16.length; i++) out[i] = i16[i] / 0x8000;

  const node = ctx.createBufferSource();
  node.buffer = buf;
  node.connect(ctx.destination);

  const now = ctx.currentTime;
  playingAt = Math.max(playingAt, now);
  node.start(playingAt);
  playingAt += buf.duration;
  sources.push(node);
  node.onended = () => {
    sources = sources.filter(s => s !== node);
    reportIfPlayed();
  };
}

/** The server's 5-second stuck timer starts once the child can no longer hear Owl. */
function reportIfPlayed() {
  if (lineDone && sources.length === 0 && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'played' }));
  }
}

function stopAudio() {
  // 재생 중이 아니면 할 일이 없다. 여기서 세대를 음소거하면
  // 아직 시작도 안 한 다음 대사가 통째로 버려진다.
  if (sources.length === 0) return;

  mutedGeneration = generation;
  sources.forEach(s => { try { s.stop(); } catch {} });
  sources = [];
  playingAt = 0;
  lineDone = true;
  reportIfPlayed();
}
</script>
</body>
</html>
